<app-header titulo="Barcos"></app-header>

<ion-content class="ion-padding">
  @for (barco of barcos; track barco.name){
    <ion-card>
      <ion-item-sliding>
        <ion-item lines="none" class="ion-padding-vertical">
          <ion-card-header class="ion-no-padding">
            <ion-card-title>{{barco.name}}</ion-card-title>
            <ion-card-subtitle>
              <ion-badge color="tertiary" style="font-weight: normal; text-transform: none;">
                {{barco.model}}
              </ion-badge>
            </ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p>{{barco.year}}</p>
            <p>{{barco.motor}}</p>
          </ion-card-content>
        </ion-item>
        <ion-item-options side="end">
          <ion-item-option color="light">
            Precio:{{barco.price}}
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    </ion-card>
  }
</ion-content>
