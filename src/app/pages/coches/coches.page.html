<app-header titulo="Coche"></app-header>

<ion-content class="ion-padding">
  @for (coche of coches; track  coche.name){
    <ion-card >
      <ion-item-sliding>
        <ion-item lines="none" class="ion-padding-vertical" >
          <ion-card-header class="ion-no-padding" >
            <ion-card-title>{{coche.name}}</ion-card-title>
            <ion-card-subtitle ><ion-badge color="tertiary" style="font-weight: normal; text-transform: none;">
              {{coche.model}}
            </ion-badge>
              </ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p>Motor: {{coche.motor}}</p>
            <p>Año: {{coche.year}}</p>
          </ion-card-content>
        </ion-item>
        <ion-item-options side="end">
          <ion-item-option color="success">
            Precio: {{coche.price}}
        </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    </ion-card>

  }


</ion-content>
