<app-header titulo="Coche"></app-header>

<ion-content class="ion-padding">
  @for (coche of coches; track  coche.name){
    <ion-card >
      <ion-item-sliding>
        <ion-item>
          <ion-card-header>
            <ion-card-title>{{coche.name}}</ion-card-title>
            <ion-card-subtitle >{{coche.model}}</ion-card-subtitle>
          </ion-card-header>
          <ion-card-content>
            <p>Motor: {{coche.motor}}</p>
            <p>Año: {{coche.year}}</p>
          </ion-card-content>

        </ion-item>
        <ion-item-option side="end">
          <ion-item-option color="success">
            Precio: {{coche.price}}
        </ion-item-option>
        </ion-item-option>
      </ion-item-sliding>
    </ion-card>

  }


</ion-content>
